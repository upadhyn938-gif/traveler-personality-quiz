<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personality Quiz</title>
    <link rel="icon" type="image/x-icon" href="/img/ideas.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href ="./css/style.css">
</head>
<body>
    <h1 class="text-center mt-4">What Type of Traveler Are You?</h1>
    

<!-- Start quiz elements -->

<div class="container d-flex justify-content-center" id="question-1">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">1. What is your dream vacation?</h4>
    <div class="row g-2">
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A">Going on an exciting adventure</button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B">Relaxing on a tropical beach</button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C">Exploring a famous city</button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D">Staying in a peaceful mountain cabin</button>
      </div>
    </div>
  </div>
</div>

<div class="container d-flex justify-content-center" id="question-2">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">2. Which activity sounds the most fun?</h4>
    <div class="row g-2">
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A">Ziplining or rock climbing</button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B">Swimming and sunbathing</button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C">Shopping and visiting museums</button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D">Walking through a beautiful forest</button>
      </div>
    </div>
  </div>
</div>

<div class="container d-flex justify-content-center" id="question-3">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">3. What would you pack first?</h4>
    <div class="row g-2">
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A">Hiking boots and adventure gear</button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B">Swimsuit and sunglasses</button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C">Stylish outfits and a camera</button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D">A cozy jacket and binoculars</button>
      </div>
    </div>
  </div>
</div>

<div class="container d-flex justify-content-center" id="question-4">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">4. How would you spend a free afternoon?</h4>
    <div class="row g-2">
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A">Trying something thrilling</button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B">Relaxing beside the ocean</button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C">Exploring cafes and local attractions</button>
      </div>
      <div class="col-md-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D">Enjoying nature and fresh air</button>
      </div>
    </div>
  </div>
</div>

<!-- End quiz elements -->


    <!-- Add more quiz elements here -->



    <div class="container d-flex justify-content-center">
      <button id="show-result" class="btn btn-success my-4">Show Results</button>
    </div>    
    <!-- Output the result here -->
    <div class="container d-flex justify-content-center">
      <div id="result-container" class="card p-4 mb-4" style="width: 75%; display: none;">
        <h3>Your Result:</h3>
        <p id="result-text"></p>
      </div>
    </div>
    
    <!-- Connect to your script file here -->
     <script src = "./js/script.js"></script>
</body>
</html>
